<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="QuickBite — Queue-Aware Predictive Food Ordering. Order ahead, skip the queue, get accurate pickup times." />
    <title>QuickBite — Order Smarter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      // ── Tailwind Design System (The Kinetic Hearth) ──────────
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-tertiary-fixed': '#2c0040',
              'on-surface': '#2c2f30',
              'surface-container-lowest': '#ffffff',
              'tertiary-fixed-dim': '#cd88ec',
              'secondary-fixed': '#dde4e6',
              'on-primary': '#0f172a',
              'on-secondary': '#edf4f6',
              'surface': '#e6f0fa',
              'secondary-fixed-dim': '#cfd6d8',
              'surface-container': '#dfecfa',
              'on-secondary-container': '#4c5355',
              'outline-variant': '#abadae',
              'on-primary-fixed': '#000000',
              'inverse-on-surface': '#9b9d9e',
              'secondary-container': '#dde4e6',
              'on-background': '#2c2f30',
              'outline': '#757778',
              'tertiary-container': '#dc95fb',
              'surface-container-highest': '#c8def4',
              'primary': '#f97316',
              'primary-fixed': '#ffedd5',
              'on-primary-fixed-variant': '#431407',
              'error': '#b41340',
              'on-tertiary': '#feeeff',
              'inverse-primary': '#ea580c',
              'on-secondary-fixed': '#394043',
              'surface-dim': '#cbdcf0',
              'secondary-dim': '#4a5153',
              'on-primary-container': '#7c2d12',
              'error-dim': '#a70138',
              'error-container': '#f74b6d',
              'surface-container-low': '#ebf3fc',
              'on-surface-variant': '#595c5d',
              'background': '#f0f5fa',
              'surface-tint': '#f97316',
              'surface-bright': '#f0f5fa',
              'surface-container-high': '#d4e5f7',
              'on-error': '#ffefef',
              'tertiary': '#7f3f9e',
              'inverse-surface': '#0c0f10',
              'primary-fixed-dim': '#ea580c',
              'primary-dim': '#c2410c',
              'on-tertiary-fixed-variant': '#591779',
              'on-error-container': '#510017',
              'surface-variant': '#dfecfa',
              'primary-container': '#ffedd5',
              'tertiary-fixed': '#dc95fb',
              'secondary': '#565d5f',
              'on-tertiary-container': '#50086f',
              'on-secondary-fixed-variant': '#565d5f',
              'tertiary-dim': '#723291',
              // Dark mode surfaces - Premium Midnight Blue Theme
              'dark-bg': '#0a1128',
              'dark-surface': '#101f42',
              'dark-card': '#1a2d5a',
              'dark-border': '#2e4374',
              'dark-text': '#f1f5f9',
              'dark-text-secondary': '#94a3b8',
              'dark-accent': '#38bdf8',
            },
            fontFamily: {
              headline: ['Plus Jakarta Sans', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
              label: ['Inter', 'sans-serif'],
            },
            borderRadius: {
              DEFAULT: '0.25rem',
              lg: '0.5rem',
              xl: '0.75rem',
              '2xl': '1rem',
              '3xl': '1.5rem',
              full: '9999px',
            },
          },
        },
      };
    </script>
    <style>
      /* Material Symbols default settings */
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      /* Hide scrollbars */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      /* Gradient helpers */
      .bg-primary-gradient {
        background: linear-gradient(135deg, #b22200 0%, #ff785a 100%);
      }
      .text-gradient {
        background: linear-gradient(135deg, #b22200 0%, #ff785a 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      /* Pulse animation */
      @keyframes pulse-soft {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      .pulse-indicator { animation: pulse-soft 2s infinite ease-in-out; }
      /* Fade in animation */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in { animation: fadeInUp 0.5s ease-out forwards; }
      /* Shimmer animation for skeleton loaders */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .shimmer {
        background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite linear;
      }
      .dark .shimmer {
        background: linear-gradient(90deg, #16213E 25%, #22325a 50%, #16213E 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite linear;
      }
      /* Premium shadow */
      .premium-shadow { box-shadow: 0px 12px 32px rgba(44, 47, 48, 0.06); }
      /* Scale tap */
      .scale-tap { transition: transform 0.15s ease; }
      .scale-tap:active { transform: scale(0.96); }
      /* Dark mode token overrides */
      .dark body { background-color: #0D0D1A; color: #E8E8FF; }
      .dark .bg-surface { background-color: #0D0D1A !important; }
      .dark .bg-surface-container-lowest { background-color: #16213E !important; }
      .dark .bg-surface-container-low { background-color: #1A1A2E !important; }
      .dark .bg-surface-container { background-color: #1A1A2E !important; }
      .dark .bg-surface-container-high { background-color: #2E2E5E !important; }
      .dark .text-on-surface { color: #E8E8FF !important; }
      .dark .text-on-background { color: #E8E8FF !important; }
      .dark .text-on-surface-variant { color: #6666AA !important; }
      .dark .border-outline-variant { border-color: #2E2E5E !important; }
      
      /* Safe area spacing utilities for native notch screens */
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px) !important;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px) !important;
      }
      .mt-safe {
        margin-top: env(safe-area-inset-top, 0px) !important;
      }
      .mb-safe {
        margin-bottom: env(safe-area-inset-bottom, 0px) !important;
      }
      
      /* Global Mobile Scaling & Safe Area Fixes */
      header:first-child, nav:first-child,
      header.fixed.top-0, nav.fixed.top-0 {
        padding-top: env(safe-area-inset-top, 0px) !important;
      }
      header:first-child.h-16, nav:first-child.h-16,
      header.fixed.top-0.h-16, nav.fixed.top-0.h-16 {
        height: calc(4rem + env(safe-area-inset-top, 0px)) !important;
        padding-top: env(safe-area-inset-top, 0px) !important;
        display: flex !important;
        align-items: flex-end !important;
        padding-bottom: 0.75rem !important;
      }
      header:first-child.py-4, nav:first-child.py-4,
      header.fixed.top-0.py-4, nav.fixed.top-0.py-4 {
        padding-top: calc(1rem + env(safe-area-inset-top, 0px)) !important;
      }
      main.pt-28, .pt-28 {
        padding-top: calc(7rem + env(safe-area-inset-top, 0px)) !important;
      }
      main.pt-24, .pt-24 {
        padding-top: calc(6rem + env(safe-area-inset-top, 0px)) !important;
      }
      main.pt-20, .pt-20 {
        padding-top: calc(5rem + env(safe-area-inset-top, 0px)) !important;
      }
      main.pb-32, .pb-32 {
        padding-bottom: calc(8rem + env(safe-area-inset-bottom, 0px)) !important;
      }
      main.pb-28, .pb-28 {
        padding-bottom: calc(7rem + env(safe-area-inset-bottom, 0px)) !important;
      }
      nav.fixed.bottom-0 {
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)) !important;
      }
      nav.fixed.bottom-0.h-20 {
        height: calc(5rem + env(safe-area-inset-bottom, 0px)) !important;
        padding-bottom: env(safe-area-inset-bottom, 0px) !important;
      }
    </style>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 font-body text-on-background min-h-screen">
    <!-- Responsive container ensures proper scaling on all devices -->
    <div class="max-w-7xl mx-auto w-full min-h-screen bg-surface dark:bg-dark-bg relative">
      <div id="root" class="w-full min-h-screen"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
